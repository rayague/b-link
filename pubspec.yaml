name: b_link
description: "B-Link : retrouvez les personnes nées le même jour que vous et n'oubliez plus les anniversaires de vos proches."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Database
  sqflite: any
  path_provider: any
  path: any

  # Image & permissions
  image_picker: any
  permission_handler: any

  # Notifications
  # Pinned to <20: the 20.0.0 major converted positional params to named and
  # requires a migration of notification_service.dart (see P2 backlog).
  flutter_local_notifications: ^19.0.0

  # Linking / calls
  url_launcher: any

  # Local storage (messages)
  shared_preferences: any

  # State management
  provider: any
  workmanager: any
  # Dates / i18n
  intl: any

  # Timezone support for scheduled notifications
  timezone: any
  # Firebase
  firebase_core: any
  firebase_analytics: any
  cloud_firestore: any
  firebase_auth: any
  google_sign_in: any
  share_plus: any
  
  # Connectivity
  connectivity_plus: ^7.3.1
  flutter_timezone: ^5.1.1
  country_picker: ^2.0.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  integration_test:
    sdk: flutter
  fake_cloud_firestore: 4.3.0
  firebase_auth_mocks: 0.15.2

flutter:
  uses-material-design: true
  assets:
    - assets/messages.txt
    - assets/logoApp.jpg
    - assets/pictureFirst.jpg
    - assets/pictureSecond.jpg

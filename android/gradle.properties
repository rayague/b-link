# Mémoire des démons de build : dimensionnée pour une machine de 8 Go
# (Gradle + démon Kotlin + compilateur Dart tournent en même temps).
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1024m
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
# Downgrade JVM-target validation errors to warnings to avoid build failures
kotlin.jvm.target.validation.mode=warning
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# permission_handler_android 14.x exige compileSdk 37 (AGP 9.1 recommande 36).
android.suppressUnsupportedCompileSdk=37

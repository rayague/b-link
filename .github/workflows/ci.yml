name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-test-e2e:
    name: Analyze, unit tests and Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Même version que le poste de dev (builds reproductibles).
          flutter-version: '3.47.7'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run unit tests
        run: flutter test --no-color --reporter=expanded

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cloud Functions unit tests
        working-directory: functions
        run: |
          npm ci
          npm test

      # firebase-tools (émulateurs) exige Java 21+ ; l'étape Flutter ci-dessus
      # utilise Java 17 (Android Gradle Plugin).
      - name: Set up JDK 21 for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Firestore security rules tests
        working-directory: test_rules
        run: |
          npm ci
          npx firebase-tools emulators:exec --only firestore --project demo-b-link "node --test"

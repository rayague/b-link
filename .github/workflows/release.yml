name: Release Build (Android AAB)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  android-aab:
    name: Build Android AAB
    runs-on: ubuntu-latest
    env:
      # Le contexte `secrets` est interdit dans les `if:` d'étape : on le
      # convertit ici en variable d'environnement.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Même version que le poste de dev (builds reproductibles).
          flutter-version: '3.47.7'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # android/app/build.gradle.kts signe la release avec android/key.properties
      # quand il existe (sinon : clé de debug, AAB non publiable).
      - name: Configure release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Warn when no release key is configured
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::Aucun secret ANDROID_KEYSTORE_BASE64 - l'AAB est signé avec la clé de debug et ne peut pas être publié sur le Play Store."

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.HAS_KEYSTORE == 'true' && 'appbundle-signed' || 'appbundle-debug-signed' }}
          path: build/app/outputs/bundle/release/*.aab
